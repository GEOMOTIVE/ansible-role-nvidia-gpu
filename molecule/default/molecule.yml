---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ubuntu-noble
    image: ubuntu:24.04
    dockerfile: Dockerfile
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    published_ports: []
    override_command: false
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      stdout_callback: default
  inventory:
    host_vars:
      ubuntu-noble:
        nvidia_driver_proc_path: /var/lib/molecule/nvidia/version
        nvidia_expected_gpu_count: 1
        nvidia_driver_reboot_required: false
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
